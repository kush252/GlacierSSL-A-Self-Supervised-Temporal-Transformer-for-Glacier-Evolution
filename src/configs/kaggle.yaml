# Kaggle override config (2x Tesla T4). Pass with:  --config src/configs/kaggle.yaml
# Only the keys that differ from default.yaml are listed; everything else is inherited.
#
# MEMORY BUDGET — read before raising max_length or batch_size.
# One training step runs the student backbone SEVEN times (1 base + 4 DINO student views
# + 2 Head-3 interval views) and EVERY call's activations stay alive until backward, so
# peak memory is their sum, not the largest one. Without gradient checkpointing each
# timestep-encoding stores ~300 MB of ViT activations, which OOMs a 16 GB T4 even at
# max_length 4. With checkpointing below it drops to ~20 MB, so the budget is:
#     ~= 7 x batch_size x window_length x 20 MB, split across the visible GPUs.
# GPU 0 additionally carries the AdamW state (~2.7 GB for 167M params) because
# DataParallel keeps the master copy there, so GPU 0 is always the binding constraint.

run:
  device: cuda
  output_root: /kaggle/working/runs    # /kaggle/input is READ-ONLY; must write here

data:
  # Base directory the manifest's relative band paths resolve against. The uploaded zip
  # expands to <slug>/new_pipeline_dataset/..., and the manifest paths already start with
  # "new_pipeline_dataset/", so this points at the dataset ROOT, not at the inner folder.
  # The notebook rewrites this line with the real slug — see README "Kaggle flow".
  data_root: /kaggle/input/CHANGEME-dataset-slug

vit:
  grad_checkpoint: true      # REQUIRED on 16 GB. Identical math (verified bit-exact on
                             # outputs and all gradients), ~6x less activation memory.
  # Pretrained spatial encoder: Prithvi-EO-1.0-100M (ViT-B/16, 6 HLS bands = our band
  # order). Download it in the notebook first (needs Internet ON in notebook settings):
  #   !wget -q -O /kaggle/working/Prithvi_EO_V1_100M.pt https://huggingface.co/ibm-nasa-geospatial/Prithvi-EO-1.0-100M/resolve/main/Prithvi_EO_V1_100M.pt
  # Set to null to train the ViT from scratch (the original runs; an ablation row).
  pretrained_ckpt: /kaggle/working/Prithvi_EO_V1_100M.pt
tet:
  grad_checkpoint: true

sampling:
  window:
    min_length: 2
    max_length: 8            # fits comfortably with checkpointing; try 12-16 next
    short_max: 4
    medium_max: 8

train:
  batch_size: 2              # 1 per GPU under DataParallel; keep even so both T4s are fed
  # Reduced from the 5e-4 baseline. Both collapsed runs showed the raw gradient norm
  # repeatedly exceeding grad_clip 3.0, and only 2 independent glaciers per step is a
  # very small batch for DINO. Revert to 5e-4 to isolate the warmup/freeze fix.
  lr: 0.0002
  num_workers: 2             # Kaggle gives 4 vCPUs; 2 loaders + main process
  epochs: 20
  amp: true
  amp_dtype: float16         # T4 is Turing -> fp16 (bfloat16 needs Ampere+)
  data_parallel: auto        # -> True when 2 GPUs are visible
  pin_memory: auto
  tf32: true                 # no effect on T4, harmless
  log_every: 5
  # Each checkpoint is ~3 GB and /kaggle/working caps at 20 GB. 0 = keep only the rolling
  # ckpt_latest.pt (still written every epoch) and no numbered milestones. Raise to 5 if
  # you want periodic snapshots AND are pushing them off to a Dataset as you go.
  ckpt_every: 0
